<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Puo - Learn Setswana</title>
    <style>
        /* --- CSS STYLES --- */
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Nunito:wght@400;500;700;800&display=swap');

        :root {
            --navy: #082f52;
            --blue: #0e547a;
            --orange: #d6532d;
            --bg-app: #fbf8ef;
            --text-light: #325f77;
            --sand: #f1e8d7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            height: 100vh;
            overflow: hidden;
        }

        /* --- THE PHONE SIMULATOR --- */
        .app-container {
            position: relative;
            width: 100%;
            max-width: 414px; 
            height: 100%;
            max-height: 896px; 
            background: var(--bg-app);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15); 
        }

        /* Top Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 15px 24px;
            font-size: 14px;
            font-weight: 700;
            color: #334;
            z-index: 10;
            flex-shrink: 0;
        }

        .status-icons {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        /* Decorative Top Orbit */
        .top-orbit { 
            position: absolute; 
            z-index: 1; 
            width: 180px; 
            height: 180px; 
            top: 60px; 
            right: -100px; 
            border: 15px solid #f1e8d8; 
            border-radius: 50%; 
            pointer-events: none;
        }

        .top-orbit i { 
            position: absolute; 
            width: 0; 
            height: 0; 
            border-top: 12px solid transparent; 
            border-bottom: 12px solid transparent; 
            border-left: 25px solid #6d9298; 
            transform: rotate(13deg); 
        }

        .top-orbit i:nth-child(1) { left: -8px; top: 52px; border-left-color: #deb97c; }
        .top-orbit i:nth-child(2) { left: 15px; top: 85px; border-left-color: #77a8ae; }
        .top-orbit i:nth-child(3) { left: 35px; top: 117px; border-left-color: #315e6c; }

        /* Main Content Layout */
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 0 28px 20px;
        }

        /* Header & Brand */
        .header-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        .brand { 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            color: var(--navy); 
            font-size: clamp(2.5rem, 6vh, 3.2rem); 
            font-weight: 800; 
            line-height: .9; 
            letter-spacing: -3px; 
        }

        .book-logo { 
            width: clamp(70px, 10vh, 85px); 
            height: auto; 
            fill: none; 
            stroke: currentColor; 
            stroke-width: 7; 
            stroke-linecap: round; 
            stroke-linejoin: round; 
            margin-bottom: 5px;
        }

        .eyebrow { 
            margin: clamp(15px, 3vh, 25px) 0 clamp(15px, 3vh, 25px); 
            text-align: center; 
            color: var(--orange); 
            font-size: clamp(0.65rem, 1.6vh, 0.75rem); 
            font-weight: 800; 
            letter-spacing: .15em; 
            text-transform: uppercase; 
            flex-shrink: 0;
        }

        /* Intro Text */
        .intro {
            flex-shrink: 0;
        }

        .intro h1 { 
            margin: 0; 
            font-size: clamp(2rem, 5.5vh, 2.8rem); 
            font-weight: 500; 
            line-height: 1.05; 
            letter-spacing: -.03em; 
            color: var(--navy);
        }

        .intro h1 strong { font-weight: 800; }

        .intro > p { 
            margin: clamp(10px, 2vh, 18px) 0 0; 
            color: var(--text-light); 
            font-size: clamp(1rem, 2.3vh, 1.15rem); 
            line-height: 1.4; 
            font-weight: 500;
        }

        /* Mascot & Guide Area */
        .guide { 
            position: relative; 
            display: flex;
            flex: 1; 
            align-items: center; 
            margin: 20px -28px 0; /* Increased top margin to separate from text */
            min-height: 200px; /* Ensures the area doesn't collapse too much */
        }

        .guide::before { 
            content: ''; 
            position: absolute; 
            inset: 15% 55% 0 -10%; 
            background: var(--sand); 
            border-radius: 50% 55% 0 0; 
            z-index: 0;
        }

        .art-wrap { 
            position: relative; 
            align-self: flex-end; 
            height: 100%;
            width: 45%; 
            display: flex;
            align-items: flex-end;
            z-index: 1;
        }

        /* Leaves SVG */
        .leaves { 
            position: absolute; 
            z-index: 1; 
            width: clamp(120px, 30vw, 160px); 
            left: -15%; 
            bottom: -9px; 
            fill: none; 
            stroke: #6b9090; 
            stroke-width: 8; 
            stroke-linecap: round; 
            pointer-events: none;
        }

        .leaves .leaf-fill { fill: #6b9090; stroke: none; }

        /* --- MASCOT IMAGE --- */
        .mascot-image { 
            position: absolute; 
            z-index: 2; 
            width: clamp(160px, 45vw, 220px); 
            height: auto; 
            left: 5%; 
            bottom: -5px; /* Adjusted to sit nicely on the sand */
            object-fit: contain;
        }

        /* --- SPEECH BUBBLE --- */
        .hello { 
            position: relative; 
            z-index: 4; 
            width: 55%; 
            padding-left: 15px; 
            align-self: center; 
            padding-bottom: 5%; 
        }

        .hello h2 { 
            position: relative; 
            display: inline-block; 
            margin: 0 0 8px; 
            font-family: 'Caveat', cursive; 
            font-size: clamp(2.2rem, 5.5vh, 3rem); 
            font-weight: 600; 
            transform: rotate(-4deg); 
            color: var(--navy);
        }

        .hello h2::after { 
            content: ''; 
            position: absolute; 
            height: 3px; 
            left: 10%; 
            right: 0; 
            bottom: 0; 
            border-radius: 50%; 
            background: var(--orange); 
            transform: rotate(-2deg); 
        }

        .hello p { 
            margin: 0; 
            color: var(--text-light); 
            font-size: clamp(0.85rem, 2vh, 1.05rem); 
            line-height: 1.4; 
            font-weight: 600;
        }

        /* Buttons Section */
        .actions { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            flex-shrink: 0; 
            padding-top: 10px;
            padding-bottom: env(safe-area-inset-bottom); 
            z-index: 10;
        }

        .actions button { 
            cursor: pointer; 
            min-height: clamp(56px, 8vh, 70px); 
            border-radius: 20px; 
            border: 0; 
            color: var(--blue); 
            background: transparent; 
            font-size: clamp(1rem, 2.2vh, 1.15rem); 
            font-weight: 700; 
            transition: transform .18s ease; 
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .actions button:hover { transform: translateY(-2px); }
        .actions button:active { transform: scale(0.98); }

        .actions svg { 
            width: 24px; 
            fill: none; 
            stroke: currentColor; 
            stroke-width: 2.5; 
            stroke-linecap: round; 
            stroke-linejoin: round; 
        }

        .actions .primary { 
            color: white; 
            background: linear-gradient(110deg, #11557e, #08375d); 
            box-shadow: 0 8px 20px rgba(8,47,82,.15); 
        }

        .actions .primary .arrow {
            position: absolute;
            right: 24px;
        }

        .actions .secondary { 
            border: 2px solid #36a9dc; 
            background: rgba(255,255,255,.3); 
        }

        .actions .text-action { 
            min-height: 40px; 
            gap: 8px; 
        }

        /* Bottom Pattern Background */
        .bottom-pattern { 
            position: absolute; 
            z-index: 1; 
            height: 100px; 
            left: 0; 
            right: 0; 
            bottom: -15px; 
            background: linear-gradient(168deg, transparent 43%, #efe4d2 44% 70%, transparent 71%), repeating-linear-gradient(128deg, transparent 0 18px, #f3eadc 19px 33px); 
            opacity: .9; 
            pointer-events: none;
        }

        /* Media Query for very small/short phones */
        @media (max-height: 750px) {
            .intro h1 { font-size: 1.7rem; }
            .guide { margin-top: 10px; min-height: 160px; }
            .actions { gap: 8px; }
            .actions button { min-height: 50px; }
            .mascot-image { width: 140px; }
            .hello { padding-bottom: 0; }
            .eyebrow { margin: 10px 0; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Top Decorative Orbit -->
        <div class="top-orbit" aria-hidden="true"><i></i><i></i><i></i></div>

        <!-- Fake Status Bar -->
        <div class="status-bar">
            <span>10:30</span>
            <div class="status-icons">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
                <span style="font-size: 12px; margin-left: 2px;">96</span>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content">
            
            <div class="header-section">
                <!-- Book Logo -->
                <div class="brand" aria-label="Puo">
                    <svg class="book-logo" viewBox="0 0 120 92" aria-hidden="true">
                        <path d="M16 17v52c0 8 7 14 15 14h18l11 9 11-9h18c8 0 15-6 15-14V17" />
                        <path d="M60 74C48 58 35 49 22 46V10c15 2 28 12 38 27v37Z" />
                        <path d="M60 74c12-16 25-25 38-28V10C83 12 70 22 60 37v37ZM30 19l23 27M29 31l25 28M90 19 67 46M91 31 66 59" />
                    </svg>
                    <span>Puo</span>
                </div>
                <p class="eyebrow">Setswana, one conversation at a time.</p>
            </div>

            <!-- Intro Text -->
            <div class="intro">
                <h1><strong>A small lesson<br>every day.</strong><br>A language for life.</h1>
                <p>Learn Setswana with Pitsi — short, playful lessons built around real conversation.</p>
            </div>

            <!-- Mascot Area -->
            <div class="guide">
                <div class="art-wrap">
                    
                    <!-- Leaves SVG -->
                    <svg class="leaves" viewBox="0 0 210 190" aria-hidden="true">
                        <path d="M37 174C34 117 28 74 15 38M47 175c7-56 17-105 44-150M59 176c20-48 42-80 79-110M74 177c35-34 69-54 118-64" />
                        <path class="leaf-fill" d="M21 85C3 68 1 46 6 21c18 24 23 43 15 64ZM49 100c-5-31 4-56 25-78 1 30-7 56-25 78ZM76 120c10-29 29-47 58-58-13 29-32 48-58 58Z" />
                    </svg>

                    <!-- Your Mascot Image -->
                    <img src="../assets/brand/pitsi.png" alt="Pitsi the Zebra" class="mascot-image">
                    
                </div>

                <!-- Speech Bubble -->
                <div class="hello">
                    <h2>Dumela!</h2>
                    <p>I’m Pitsi. I’ll be here to guide you as you learn Setswana.</p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="actions">
                <button class="primary" onclick="alert('Starting lesson...')">
                    Get started 
                    <svg class="arrow" viewBox="0 0 24 24"><path d="M5 12h13M14 7l5 5-5 5" /></svg>
                </button>
                <button class="secondary" onclick="alert('Logging in...')">
                    I already have an account
                </button>
                <button class="text-action" onclick="alert('Trying a lesson...')">
                    Try a lesson 
                    <svg viewBox="0 0 24 24"><path d="M5 12h13M14 7l5 5-5 5" /></svg>
                </button>
            </div>

        </div>
        
        <!-- Bottom Pattern -->
        <div class="bottom-pattern" aria-hidden="true"></div>

    </div>

</body>
</html>
